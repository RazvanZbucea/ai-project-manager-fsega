@if (authService.currentUser()) {
  <header class="main-navbar">
    <div class="navbar-brand">
      <span class="logo">🚀 AI Project Manager</span>
    </div>

    <nav class="navbar-menu">
      <a routerLink="/projects" routerLinkActive="active-link" class="nav-link">Proiecte</a>

      @if (authService.hasRole('ADMIN')) {
        <a routerLink="/admin/users" routerLinkActive="active-link" class="nav-link">
          <span class="icon">⚙️</span> Management Utilizatori
        </a>
      }
    </nav>

    <div class="navbar-actions">
      <div class="user-info">
        👤 Salut, <strong>{{ authService.currentUser()?.username }}</strong>
        <span class="user-role">({{ authService.currentUser()?.role }})</span>
      </div>
      <button class="btn btn--logout" (click)="authService.logout()">Delogare</button>
    </div>
  </header>
}

<main class="main-content">
  <router-outlet></router-outlet>
</main>
